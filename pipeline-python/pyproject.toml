[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trellora-pipeline-worker"
version = "0.2.0"
description = "Trellora 本地文档结构化处理 Worker"
requires-python = ">=3.10,<4.0"
dependencies = [
  "jieba==0.42.1",
  "igraph>=0.11",
  "leidenalg>=0.11",
  "networkx>=3.1",
]

[tool.setuptools.packages.find]
include = ["pipeline_worker*"]
