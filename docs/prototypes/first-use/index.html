      {id:'notes',label:'笔记',icon:'note',short:'写笔记、管理文件，编辑后自动保存。',detail:'<strong>笔记：</strong>先创建或打开笔记库，再新建笔记。已有 Markdown 文件也可以直接打开。'},
      {id:'sources',label:'资料',icon:'upload',short:'导入文档，处理后用于资料问答。',detail:'<strong>资料：</strong>导入 PDF、DOCX 等文档并查看处理进度；资料准备好后再提问。'},
      {id:'wiki',label:'Wiki',icon:'spark',short:'阅读、整理资料形成的主题知识。',detail:'<strong>Wiki：</strong>围绕已导入资料查看主题和知识条目，后续再开始使用。'},
      {id:'graph',label:'地图',icon:'map',short:'探索资料中的主题和关联。',detail:'<strong>地图：</strong>当资料库已经准备好，可以沿关联探索知识，再就某个主题提问。'},
      {id:'libraries',label:'笔记库',icon:'library',short:'创建、打开和切换笔记库。',detail:'<strong>笔记库：</strong>按工作、学习等用途管理多个笔记库；原文件保存在所选文件夹中。'},
      {id:'settings',label:'设置',icon:'settings',short:'配置 AI、外观和工作区。',detail:'<strong>设置：</strong>下一步会带你配置一个语言模型，向量模型和文档解析可以稍后设置。'}
    ];
    const sample='请用 3 个步骤教我整理一次项目会议纪要。';
    let state={scene:'menus',menu:'assistant',provider:'deepseek',key:'',model:'',consent:false,tested:false,testAttempted:false,saved:false,error:'',draft:'',answer:false,sending:false,deferred:false,dialog:false,guideDone:false,revision:0};
    const currentStep=()=>state.scene==='menus'?1:state.scene==='config'?2:3;
    function rail(){const active=state.scene==='menus'?state.menu:state.scene==='config'?'settings':'assistant';const item=m=>`<button class="nav ${m.id===active?'active':''}" data-menu="${m.id}" aria-label="${m.label}" ${m.id===active?'aria-current="page"':''}>${icon(m.icon)}<span>${m.label}</span></button>`;return `<aside class="rail" aria-label="空间导航"><div class="brand"><img src="../../../build/icon.svg" alt="Trellora"></div>${menus.slice(0,5).map(item).join('')}<div class="rail-bottom">${item(menus[5])}<div class="rail-divider"></div>${item(menus[6])}</div></aside>`;}
    function guidebar(){const n=currentStep();return `<div class="guidebar"><div class="guide-heading">首次使用引导</div><div class="guide-steps">${['认识菜单','配置 AI','第一次提问'].map((label,i)=>{const done=i+1<n&&(i!==1||state.tested);const text=i===1&&n===3&&!state.tested?(state.saved?'配置待验证':'暂未配置 AI'):label;return `${i?'<span class="step-line"></span>':''}<div class="guide-step ${i+1===n?'current':done?'done':''}"><span class="step-number">${done?'✓':i+1}</span>${text}</div>`;}).join('')}</div><div class="guide-actions"><span class="small dim">${n} / 3</span><button class="btn subtle small" data-action="defer">稍后继续</button><button class="close" data-action="defer" aria-label="关闭并保留进度">×</button></div></div>`;}
    function assistantHeader(){return `<header class="assistant-header"><div><h2>AI 问答</h2><p>开放式问答，不读取个人资料库。</p></div><div class="row"><span class="badge">${icon('library')}无资料库</span>${state.saved?'<span class="badge ok">已选择语言模型</span>':'<span class="badge">待配置模型</span>'}<button class="btn subtle small" data-action="new-chat">${icon('plus')}新对话</button><button class="btn subtle small" data-action="to-config" aria-label="打开模型设置">${icon('settings')}</button></div></header>`;}
    function composer(){return `<div class="composer"><div class="composer-box ${state.scene==='question'&&!state.answer&&!state.deferred?'highlight':''}"><div class="composer-meta"><span class="badge">开放式问答</span><span>${state.saved?'默认连接 · '+(state.provider==='ollama'?'本地模型':state.provider==='custom'?'自定义 API':'DeepSeek'):'选择语言模型'}</span></div><textarea id="question" aria-label="向 AI 助手输入问题" placeholder="输入问题，Enter 发送；Shift + Enter 换行…" ${state.sending?'disabled':''}>${escape(state.draft)}</textarea><div class="composer-footer"><span>${icon('plus')} <span style="vertical-align:4px">添加附件</span></span><button class="send" data-action="send" aria-label="发送问题" ${!state.saved||!state.draft.trim()||state.sending?'disabled':''}>${icon('up')}</button></div></div><p class="composer-note">Enter 发送 · Shift + Enter 换行</p></div>`;}
    function thread(){return `<div class="chat-thread"><div class="user-message">${escape(state.sentDraft||sample)}</div><div class="answer-row"><div class="avatar">${icon('spark')}</div><div class="answer-text">${state.sending?'<span class="muted">正在回答…</span>':'<h3>可以按这 3 步整理：</h3><ol><li><strong>记录基本信息。</strong>写清会议时间、参与人和讨论主题。</li><li><strong>整理结论和待办。</strong>把每项决策、负责人和截止日期分开列出。</li><li><strong>确认并归档。</strong>请参与人核对，将确认后的纪要存入对应项目的笔记库。</li></ol><p>你可以继续问：“帮我做一个会议纪要模板。”</p><div class="answer-tools">复制回答　 ·　继续追问</div>'}</div></div>${state.answer&&!state.deferred&&!state.guideDone?`<div class="success-inline">${icon('check')}<div><strong>你已经完成第一次提问</strong><br>可以接着追问；真实使用时，AI 回答的内容需要自行核实。</div></div>`:''}</div>`;}
    function assistant(){return `<div class="assistant-main">${assistantHeader()}<div class="assistant-content">${state.answer||state.sending?thread():`<div class="hello"><div class="hello-icon">${icon('spark')}</div><h1>从一个问题开始</h1><p>先试一次开放式问答，体验输入、回答和追问。<br>之后再把自己的笔记和资料加入进来。</p><div class="suggestions"><button class="chip" data-draft="${escape(sample)}">整理会议纪要</button><button class="chip" data-draft="请给我一个一周学习计划的模板。">制定学习计划</button><button class="chip" data-draft="请帮我列出项目复盘需要回答的五个问题。">准备项目复盘</button></div></div>`}</div>${composer()}</div>`;}
    function tour(){return `<div class="tour-mask"></div><section class="tour-card" aria-label="认识菜单"><div class="eyebrow">第 1 步 · 认识菜单</div><h2>先找到你要用的入口</h2><p>左侧菜单一直都在。先记住“助手”和“笔记”，<br>资料、Wiki 和地图可以等用到时再探索。</p><div class="menu-grid">${menus.map(m=>`<button class="menu-item ${state.menu===m.id?'active':''}" data-menu="${m.id}">${icon(m.icon)}<div><strong>${m.label}</strong><span>${m.short}</span></div></button>`).join('')}</div><div class="menu-detail" aria-live="polite">${menus.find(m=>m.id===state.menu).detail}</div><div class="tour-foot"><button class="btn subtle small" data-action="defer">稍后继续</button><button class="btn primary" data-action="to-config">下一步：配置 AI ${icon('arrow')}</button></div></section>`;}
    function task(n,title,description,done,current){return `<div class="task ${done?'done':current?'current':''}"><span class="task-dot">${done?'✓':n}</span><div><strong>${title}</strong><p>${description}</p></div></div>`;}
    function sideConfig(){const filled=state.provider==='ollama'?Boolean(state.model.trim()):Boolean(state.key.trim()&&state.model.trim());return `<aside class="guide-side"><div class="eyebrow">第 2 步 · 配置 AI</div><h2>先连接一个<br>回答问题的模型</h2><p>设置会决定助手使用哪一个模型。<br>已有连接可以直接选用。</p><div class="tasks">${task(1,'选择连接方式','使用远程 API，或已有的本地 Ollama。',true,false)}${task(2,'填写密钥和模型','服务地址由厂商自动填入。',filled,!filled)}${task(3,'测试连接','检查服务地址和访问凭据。',state.tested,filled&&!state.tested)}${task(4,'保存模型设置','将这条连接设为默认。',state.saved,state.tested&&!state.saved)}</div><div class="side-tip"><strong>这次只需配置语言模型</strong><br>向量模型、联网搜索和 PDF 解析，等使用相应功能时再配置。</div><div class="side-bottom">${state.saved&&state.tested?'<div class="notice">连接测试通过，设置已保存。<br>下一步试试能否正常回答。</div>':state.saved?'<div class="notice">配置已保存，连接待验证。</div>':'<div class="small dim">完成测试并保存后，就可以继续。</div>'}<button class="btn primary" data-action="to-question" ${!state.saved||!state.tested?'disabled':''}>下一步：试着提问 ${icon('arrow')}</button>${state.saved&&!state.tested&&state.testAttempted?'<button class="btn" data-action="try-question">配置已保存，尝试一次提问</button>':''}<button class="btn subtle small" data-action="preview">暂不配置，看看怎么提问</button><button class="btn subtle small" data-action="to-menus">返回菜单介绍</button></div></aside>`;}
    function settings(){return `<nav class="settings-nav" aria-label="设置分区"><h3>设置</h3><div class="settings-group">工作区配置</div><div class="settings-item">${icon('settings')}通用</div><div class="settings-item">${icon('library')}工作区与备份</div><div class="settings-item">${icon('note')}编辑器</div><div class="settings-group">文档处理</div><div class="settings-item">${icon('upload')}文档解析</div><div class="settings-group">AI 设置</div><div class="settings-item">${icon('globe')}联网搜索</div><div class="settings-item active">${icon('bot')}模型配置</div><div class="settings-item">${icon('spark')}AI 助手技能</div><div class="settings-item">${icon('chat')}个性化</div></nav><section class="settings-main"><div class="eyebrow">AI 设置</div><h1>模型配置</h1><p>添加一个语言模型连接，供问答和文字整理使用。</p><div class="model-card"><div class="row between"><h3>${state.provider==='ollama'?'本地模型连接':'语言模型连接'}</h3><span class="badge">默认</span></div><div class="form-grid"><div class="field"><label for="connection">连接方式</label><select id="connection"><option value="remote" ${state.provider!=='ollama'?'selected':''}>远程 API</option><option value="ollama" ${state.provider==='ollama'?'selected':''}>本地模型（Ollama）</option></select></div><div class="field"><label for="provider">${state.provider==='ollama'?'本地服务':'API 厂商'}</label>${state.provider==='ollama'?'<input value="Ollama" readonly>':`<select id="provider"><option value="deepseek" ${state.provider==='deepseek'?'selected':''}>DeepSeek</option><option value="custom" ${state.provider==='custom'?'selected':''}>自定义 OpenAI 兼容 API</option></select>`}</div><div class="field full"><label for="endpoint">${state.provider==='ollama'?'Ollama 地址':'API 地址'}</label><input id="endpoint" value="${escape(state.endpoint||(state.provider==='ollama'?'http://127.0.0.1:11434':state.provider==='custom'?'https://gateway.example.test/v1':'https://api.deepseek.com/v1'))}"><p class="field-help">使用厂商默认地址；自定义网关可以修改。</p></div>${state.provider==='ollama'?'':`<div class="field full"><label for="key">API Key</label><input type="password" id="key" value="${escape(state.key)}" autocomplete="off" placeholder="仅需演示密钥，无需填写真实信息"><p class="field-help">密钥会安全保存在此设备。</p></div>`}<div class="field full"><label for="model">生成模型</label><div class="field-line"><input id="model" value="${escape(state.model)}" placeholder="选择模型，或输入模型名称"><button class="btn small" data-action="fill">填入演示配置</button></div><p class="field-help">用于摘要、问答、实体提取和整理建议。</p></div></div>${state.provider==='ollama'?'':`<label class="model-consent"><input type="checkbox" id="consent" ${state.consent?'checked':''}>我了解：使用远程模型时，问题和本次所用内容会发送给所选服务商。</label>`}<div class="form-actions"><button class="btn" data-action="test">${icon('history')}测试连接</button><button class="btn primary" data-action="save">${icon('check')}保存模型设置</button></div>${state.error?`<div class="notice error" role="alert">${escape(state.error)}</div>`:state.saved?'<div class="notice" role="status">'+(state.tested?'模型设置已保存。可以进入下一步，验证实际回答。':'模型设置已保存，连接待验证。可修复配置，或尝试一次实际提问。')+'</div>':state.tested?'<div class="notice" role="status">连接检测成功。请保存模型设置，再试着提问。</div>':''}</div><p class="optional">向量模型与文档解析可以稍后配置。</p></section>${state.deferred?'':sideConfig()}`;}
    function sideQuestion(){const preview=!state.saved;return `<aside class="guide-side"><div class="eyebrow">第 3 步 · 第一次提问</div><h2>${preview?'先看看怎么提问':'亲手问一个问题'}</h2><p>${preview?'配置模型后即可发送真实问题。先熟悉操作，稍后也能回来继续。':'当前使用开放式问答，无需先导入资料。'}</p><div class="tasks">${task(1,'使用开放式问答','暂不选择个人资料库。',true,false)}${task(2,'填入一个问题','点击示例问题，或写自己的问题。',Boolean(state.draft||state.answer),!state.draft&&!state.answer)}${task(3,'点击发送','Enter 发送，Shift + Enter 换行。',state.answer,Boolean(state.draft)&&!state.answer)}${task(4,'阅读回答，再试着追问','例如：“帮我做一个会议纪要模板。”',state.answer,false)}</div><div class="side-tip">以后想问自己的内容？<br>在笔记中使用笔记助手；在“资料”中导入并处理文档后，再使用知识库问答。</div><div class="side-bottom">${preview?'<div class="small dim">还没有配置模型，当前不能发送。</div><button class="btn primary" data-action="to-config">返回配置 AI</button><button class="btn subtle" data-action="defer">稍后继续</button>':state.answer?'<button class="btn primary" data-action="finish">完成引导 '+icon('check')+'</button><div class="small dim">引导结束后，会保留当前对话。</div>':'<button class="btn" data-action="sample">填入示例问题</button><div class="small dim">收到一次完整回答后，可以完成引导。</div>'}<button class="btn subtle small" data-action="to-config">返回模型配置</button></div></aside>`;}
    function complete(){return `<div class="completion-banner"><div class="row">${icon('check')}<div><strong>已完成首次使用引导</strong><p>随时可在“设置 → 通用 → 首次使用引导”重新查看。</p></div></div><button class="btn small" data-action="continue-chat">继续提问 ${icon('arrow')}</button></div><div class="view"><div class="assistant-main">${assistantHeader()}<div class="assistant-content"><div class="completion-hero"><div class="hello-icon">${icon('check')}</div><h1>现在，开始做你自己的事</h1><p>你已经认识菜单、配置好 AI，并完成第一次提问。<br>接下来可以继续对话，或把自己的内容整理进来。</p><div class="next-grid"><button class="next-card" data-action="continue-chat">${icon('chat')}<strong>继续提问</strong><span>在刚才的回答上继续追问。</span></button><button class="next-card" data-action="notes-preview">${icon('note')}<strong>写第一篇笔记</strong><span>创建笔记库，再新建笔记。</span></button><button class="next-card" data-action="sources-preview">${icon('upload')}<strong>导入一份资料</strong><span>查看文档处理与资料问答。</span></button></div></div></div></div></div>`;}
    function render(){document.querySelectorAll('[data-scene]').forEach(el=>el.classList.toggle('active',el.dataset.scene===state.scene));const paused=state.deferred,finished=state.guideDone&&state.scene==='question';const content=state.scene==='complete'?complete():`${finished?'':paused?`<div class="pause"><div>首次使用引导已暂停<p>进度已保留，可以稍后继续。</p></div><button class="btn small" data-action="resume">继续引导</button></div>`:guidebar()}<div class="view">${state.scene==='config'?settings():assistant()}${state.scene==='question'&&!paused&&!finished?sideQuestion():''}</div>`;document.getElementById('app').innerHTML=`<div class="titlebar"><span>Trellora</span><div class="window-controls"><span>−</span><span>□</span><span>×</span></div></div><div class="body">${rail()}<div class="workspace">${content}</div>${state.scene==='menus'&&!paused?tour():''}${state.dialog?`<div class="modal-mask"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="pause-title"><h2 id="pause-title">稍后继续引导？</h2><p>当前步骤会保留。你可以先使用应用，之后从“设置 → 通用 → 首次使用引导”继续。</p><div class="row"><button class="btn" data-action="cancel-defer">继续引导</button><button class="btn primary" data-action="confirm-defer">稍后继续</button></div></section></div>`:''}</div>`;if(state.dialog)document.querySelector('[data-action="cancel-defer"]').focus();}
    function announce(message){document.getElementById('live').textContent=message;}
    function invalidate(){state.tested=false;state.testAttempted=false;state.saved=false;state.error='';state.revision++;}
    function setScene(scene,review=false){if(state.sending){state.sending=false;state.revision++;}state.scene=scene;state.guideDone=scene==='complete';state.deferred=false;state.dialog=false;if(review&&(scene==='question'||scene==='complete')){state.key='demo-key';state.model='deepseek-chat';state.consent=true;state.tested=true;state.saved=true;state.answer=scene==='complete';state.draft=scene==='complete'?'':sample;state.sentDraft=sample;}render();}
    function send(){if(!state.saved||!state.draft.trim()||state.sending)return;state.sentDraft=state.draft;state.draft='';state.sending=true;state.answer=false;const revision=state.revision;render();setTimeout(()=>{if(revision!==state.revision)return;state.sending=false;state.answer=true;state.tested=true;render();announce('演示回答已完成。可以完成引导。');},650);}
    document.addEventListener('click',event=>{const sceneButton=event.target.closest('[data-scene]');if(sceneButton){setScene(sceneButton.dataset.scene,true);return;}const m=event.target.closest('[data-menu]');if(m){if(state.scene==='menus'){state.menu=m.dataset.menu;render();}else if(m.dataset.menu==='settings'){setScene('config');}else if(m.dataset.menu==='assistant'){setScene('question');}else{announce('此原型只演示首次使用引导。');}return;}const draft=event.target.closest('[data-draft]');if(draft){state.draft=draft.dataset.draft;render();document.getElementById('question').focus();return;}const action=event.target.closest('[data-action]')?.dataset.action;if(!action)return;if(action==='to-config')setScene('config');if(action==='to-menus')setScene('menus');if(action==='to-question'&&state.saved&&state.tested)setScene('question');if(action==='try-question'&&state.saved)setScene('question');if(action==='preview')setScene('question');if(action==='fill'){state.key='demo-key';state.model=state.provider==='ollama'?'local-demo-model':'deepseek-chat';state.consent=true;invalidate();render();}if(action==='test'){state.testAttempted=true;const filled=state.provider==='ollama'?Boolean(state.model.trim()):Boolean(state.key.trim()&&state.model.trim()&&state.consent);state.error=!filled?'请填写模型和演示密钥，并确认发送范围。':document.getElementById('test-result').value==='failure'?'连接检测失败，请检查密钥、服务地址或网络后重试。':'';state.tested=filled&&!state.error;state.saved=false;render();announce(state.error||'演示连接检测成功。');}if(action==='save'){const filled=state.provider==='ollama'?Boolean(state.model.trim()):Boolean(state.key.trim()&&state.model.trim()&&state.consent);if(!filled){state.error='请先补全模型设置。';}else{state.saved=true;}render();}if(action==='sample'){state.draft=sample;render();document.getElementById('question').focus();}if(action==='send')send();if(action==='finish'&&state.answer)setScene('complete');if(action==='continue-chat'){state.scene='question';state.guideDone=true;state.deferred=false;render();}if(action==='defer'){state.dialog=true;render();}if(action==='cancel-defer'){state.dialog=false;render();}if(action==='confirm-defer'){state.dialog=false;state.deferred=true;render();}if(action==='resume'){state.deferred=false;render();}if(action==='new-chat'){state.revision++;state.answer=false;state.sending=false;state.draft='';render();}if(action==='notes-preview'||action==='sources-preview')announce('该入口复用应用现有流程。本原型演示范围为首次使用引导。');});
    document.addEventListener('input',event=>{const id=event.target.id;if(id==='question'){state.draft=event.target.value;const sendButton=document.querySelector('[data-action="send"]');sendButton.disabled=!state.saved||!state.draft.trim()||state.sending;}if(['key','model','endpoint'].includes(id)){state[id]=event.target.value;invalidate();const next=document.querySelector('[data-action="to-question"]');if(next)next.disabled=true;document.querySelectorAll('.model-card .notice').forEach(el=>el.remove());const side=document.querySelector('.guide-side');if(side)side.outerHTML=sideConfig();}});
    document.addEventListener('change',event=>{const id=event.target.id;if(id==='provider'){state.provider=event.target.value;state.endpoint='';invalidate();render();}if(id==='connection'){state.provider=event.target.value==='ollama'?'ollama':'deepseek';state.endpoint='';state.model='';state.key='';invalidate();render();}if(id==='consent'){state.consent=event.target.checked;invalidate();render();}});
    document.addEventListener('keydown',event=>{if(event.target.id==='question'&&event.key==='Enter'&&!event.shiftKey&&!event.isComposing){event.preventDefault();send();}if(event.key==='Escape'){if(state.dialog){state.dialog=false;render();}else if(!state.deferred&&state.scene!=='complete'){state.dialog=true;render();}}if(event.key==='Tab'&&state.dialog){const elements=[...document.querySelectorAll('.dialog button')];if(event.shiftKey&&document.activeElement===elements[0]){event.preventDefault();elements.at(-1).focus();}else if(!event.shiftKey&&document.activeElement===elements.at(-1)){event.preventDefault();elements[0].focus();}}});
    document.getElementById('theme-button').addEventListener('click',()=>{const dark=document.documentElement.dataset.theme==='dark';document.documentElement.dataset.theme=dark?'light':'dark';document.getElementById('theme-button').textContent=dark?'深色':'浅色';});
    document.getElementById('reset').addEventListener('click',()=>{state={scene:'menus',menu:'assistant',provider:'deepseek',key:'',model:'',consent:false,tested:false,testAttempted:false,saved:false,error:'',draft:'',answer:false,sending:false,deferred:false,dialog:false,guideDone:false,revision:state.revision+1};render();});
    window.prototype={setScene:(scene)=>setScene(scene,true),getState:()=>({...state}),setTheme:theme=>{document.documentElement.dataset.theme=theme;document.getElementById('theme-button').textContent=theme==='dark'?'浅色':'深色';}};
    render();
  </script>
</body>
</html>
